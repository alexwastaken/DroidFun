name: Build DroidFun App for Mac
run-name: DroidFun App macOS · ${{ inputs.source_ref }}

# Manual only: publication and website downloads remain a separate step.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact application commit or branch to build
        required: true
        default: main
      upload_to_draft:
        description: Upload verified packages to an existing draft instead of Actions artifacts
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: droidfun-macos-packages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Check out requested application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Set up Rust for Apple Silicon and Intel
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Check frontend
        run: npm run check
      - name: Check updater release tooling
        run: node --test scripts/updater-release.test.cjs
      - name: Check firmware behavior with sanitizers
        shell: bash
        run: |
          set -euo pipefail
          for test in standalone_test standalone_lifecycle_test oled_address_test packet_bounds_test powered_standby_test; do
            clang++ -std=c++17 -Wall -Wextra -Werror -Wno-unused-function -fsanitize=address,undefined -Ifirmware/tests/mocks "firmware/tests/${test}.cpp" -o "$RUNNER_TEMP/droidfun-${test}"
            "$RUNNER_TEMP/droidfun-${test}"
          done
      - name: Run native behavior tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml --lib 2>&1 | tee packages/native-tests-macOS.txt
      - name: Build universal app and disk image
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npm run release -- --target universal-apple-darwin --updater
      - name: Verify and collect Mac packages
        run: node scripts/mac-package-evidence.cjs
      - name: Upload packages for installation verification
        if: ${{ !inputs.upload_to_draft }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DroidFun-App-macOS-universal
          path: packages/
          if-no-files-found: error
          retention-days: 14
      - name: Check out draft upload tooling
        if: ${{ inputs.upload_to_draft }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: .release-pipeline
          persist-credentials: false
          sparse-checkout: |
            scripts/upload-draft-packages.cjs
            scripts/updater-assets.cjs
          sparse-checkout-cone-mode: false
      - name: Upload verified packages to existing draft
        if: ${{ inputs.upload_to_draft }}
        env:
          GH_TOKEN: ${{ github.token }}
          DESKBOT_SOURCE_SHA: ${{ inputs.source_ref }}
        run: node .release-pipeline/scripts/upload-draft-packages.cjs
