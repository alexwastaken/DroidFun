name: Build DroidFun App for Mac
run-name: DroidFun App macOS · ${{ inputs.signing_mode || 'developer-id' }} · ${{ inputs.source_ref }}

# Manual only: publication and website downloads remain a separate step.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact application commit or branch to build
        required: true
        default: main
      upload_to_draft:
        description: Upload verified packages to an existing draft instead of Actions artifacts
        type: boolean
        default: false
      runner:
        description: Standard Mac runner (use another image if capacity is queued)
        type: choice
        options:
          - macos-15
        default: macos-15
      signing_mode:
        description: Choose Apple-trusted, approved unnotarized, or private testing package
        type: choice
        options:
          - developer-id
          - public-adhoc
          - internal-adhoc
        default: developer-id
      allow_unnotarized:
        description: Explicitly approve a public Mac build without Apple Developer ID or notarization
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: droidfun-macos-packages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      DROIDFUN_MAC_SIGNING_MODE: ${{ inputs.signing_mode || 'developer-id' }}
      DROIDFUN_ALLOW_UNNOTARIZED: ${{ inputs.allow_unnotarized && '1' || '0' }}
      DROIDFUN_PACKAGING_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out requested application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Check out pinned packaging tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: .mac-packaging-pipeline
          persist-credentials: false
          sparse-checkout: |
            scripts/mac-release-policy.cjs
            scripts/mac-trust.cjs
            scripts/release.cjs
            scripts/mac-package-evidence.cjs
            scripts/mac-release.test.cjs
            scripts/updater-release.test.cjs
          sparse-checkout-cone-mode: false
      - name: Stage packaging-only tools and preserve application source
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require('node:fs'),{execFileSync}=require('node:child_process');
          const allowed=['mac-release-policy.cjs','mac-trust.cjs','release.cjs','mac-package-evidence.cjs','mac-release.test.cjs','updater-release.test.cjs'].map(name=>'scripts/'+name);
          for(const file of allowed)fs.copyFileSync('.mac-packaging-pipeline/'+file,file);
          const changed=execFileSync('git',['diff','--name-only','HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          if(changed.some(file=>!allowed.includes(file)))throw Error('Packaging overlay modified application source');
          const sha=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          if(!/^[0-9a-f]{40}$/.test(sha)||!/^[0-9a-f]{40}$/.test(process.env.DROIDFUN_PACKAGING_COMMIT||''))throw Error('Exact application and packaging commits are required');
          console.log({applicationCommit:sha,packagingCommit:process.env.DROIDFUN_PACKAGING_COMMIT,packagingOnlyFiles:changed});
          JS
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Check public signing credentials before building
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UPLOAD_TO_DRAFT: ${{ inputs.upload_to_draft }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DROIDFUN_MAC_SIGNING_MODE" == internal-adhoc && "$UPLOAD_TO_DRAFT" == true ]]; then
            echo 'Internal ad-hoc packages cannot be uploaded to a public-release draft.' >&2
            exit 1
          fi
          if [[ "$DROIDFUN_MAC_SIGNING_MODE" == public-adhoc ]]; then
            [[ "$DROIDFUN_ALLOW_UNNOTARIZED" == 1 ]] || { echo 'Explicit unnotarized publication approval is required.' >&2; exit 1; }
            node scripts/mac-release-policy.cjs --mac-signing public-adhoc --allow-unnotarized
          else
            node scripts/mac-release-policy.cjs --mac-signing "$DROIDFUN_MAC_SIGNING_MODE"
          fi
      - name: Set up Rust for Apple Silicon and Intel
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Check frontend
        run: npm run check
      - name: Check public customer security boundary
        run: node --test scripts/public-boundary.test.cjs
      - name: Check updater release tooling
        run: node --test scripts/updater-release.test.cjs scripts/mac-release.test.cjs
      - name: Check firmware behavior with sanitizers
        shell: bash
        run: |
          set -euo pipefail
          for test in standalone_test standalone_lifecycle_test oled_address_test packet_bounds_test powered_standby_test display_speed_test; do
            clang++ -std=c++17 -Wall -Wextra -Werror -Wno-unused-function -fsanitize=address,undefined -Ifirmware/tests/mocks "firmware/tests/${test}.cpp" -o "$RUNNER_TEMP/droidfun-${test}"
            "$RUNNER_TEMP/droidfun-${test}"
          done
      - name: Run native behavior tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml --lib 2>&1 | tee packages/native-tests-macOS.txt
      - name: Build universal app and disk image
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DROIDFUN_MAC_SIGNING_MODE" == developer-id ]]; then
            npm run release -- --target universal-apple-darwin --mac-signing developer-id --updater
          elif [[ "$DROIDFUN_MAC_SIGNING_MODE" == public-adhoc ]]; then
            [[ "$DROIDFUN_ALLOW_UNNOTARIZED" == 1 ]] || exit 1
            npm run release -- --target universal-apple-darwin --mac-signing public-adhoc --allow-unnotarized --updater
          else
            npm run release -- --target universal-apple-darwin --mac-signing internal-adhoc
          fi
      - name: Confirm application source stayed unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- src src-tauri package.json package-lock.json firmware resources
      - name: Verify and collect Mac packages
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/mac-package-evidence.cjs
      - name: Upload packages for installation verification
        if: ${{ !inputs.upload_to_draft }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DroidFun-App-macOS-universal-${{ inputs.signing_mode || 'developer-id' }}
          path: packages/
          if-no-files-found: error
          retention-days: 14
      - name: Check out draft upload tooling
        if: ${{ inputs.upload_to_draft }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: .release-pipeline
          persist-credentials: false
          sparse-checkout: |
            scripts/upload-draft-packages.cjs
            scripts/updater-assets.cjs
            scripts/mac-release-policy.cjs
          sparse-checkout-cone-mode: false
      - name: Upload verified packages to existing draft
        if: ${{ inputs.upload_to_draft }}
        env:
          GH_TOKEN: ${{ github.token }}
          DESKBOT_SOURCE_SHA: ${{ inputs.source_ref }}
        run: node .release-pipeline/scripts/upload-draft-packages.cjs
